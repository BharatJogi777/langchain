services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: outbox
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5437:5432"
    volumes:
      - outbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  outbox_pgdata:
