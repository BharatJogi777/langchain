services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: local-dev-only-change-me
    ports:
      - "5435:5432"
    volumes:
      - durable_approval_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  durable_approval_pgdata:
